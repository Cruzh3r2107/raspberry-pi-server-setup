events {
    worker_connections 1024;
}

http {
    # Enable SSL protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upstream to Actual Budget server
    upstream actual_backend {
        server actual_server:5006;
    }

    server {
        listen 5006 ssl;
        listen [::]:5006 ssl;

        server_name actual-budget.local localhost 192.168.0.104 100.126.21.128;

        # SSL certificate paths (mounted from host)
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Client max body size (for file uploads)
        client_max_body_size 50M;

        location / {
            proxy_pass http://actual_backend;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # IMPORTANT: Pass through the COOP/COEP headers from actual-server
            # These headers are critical for SharedArrayBuffer to work
            proxy_pass_request_headers on;
        }
    }
}
